version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-dev-minor-patch:
        dependency-type: development
        update-types:
          - patch
          - minor
      npm-prod-minor-patch:
        dependency-type: production
        update-types:
          - patch
          - minor
      npm-major-updates:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - '*'
